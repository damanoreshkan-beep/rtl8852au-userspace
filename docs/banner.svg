<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" role="img" aria-label="RTL8852AU no-root userspace driver">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0a0f1a"/>
      <stop offset="1" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="txglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <clipPath id="card"><rect x="0" y="0" width="1000" height="280" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <!-- faint grid -->
    <g stroke="#1b2740" stroke-width="1" opacity="0.45">
      <path d="M0 70H1000M0 140H1000M0 210H1000"/>
      <path d="M125 0V280M250 0V280M375 0V280M500 0V280M625 0V280M750 0V280M875 0V280"/>
    </g>

    <!-- radiating RF waves: the transmit-over-air achievement -->
    <g fill="none" stroke="url(#accent)" stroke-width="2">
      <circle cx="150" cy="180" r="10" opacity="0">
        <animate attributeName="r" values="10;300" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="150" cy="180" r="10" opacity="0">
        <animate attributeName="r" values="10;300" dur="3.4s" begin="1.13s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="3.4s" begin="1.13s" repeatCount="indefinite"/>
      </circle>
      <circle cx="150" cy="180" r="10" opacity="0">
        <animate attributeName="r" values="10;300" dur="3.4s" begin="2.26s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="3.4s" begin="2.26s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- TX node: the AX56 adapter -->
    <circle cx="150" cy="180" r="46" fill="url(#txglow)">
      <animate attributeName="r" values="40;52;40" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <g>
      <rect x="120" y="158" width="60" height="44" rx="7" fill="#0e1a2b" stroke="url(#accent)" stroke-width="2"/>
      <rect x="146" y="138" width="8" height="24" rx="4" fill="url(#accent)"/>
      <circle cx="150" cy="134" r="5" fill="#34d399"/>
      <text x="150" y="185" text-anchor="middle" fill="#8fe9dd" font-size="12" font-weight="700" letter-spacing="1">AX56</text>
    </g>

    <!-- RX node: the second receiver catching frames over the air -->
    <g opacity="0.92">
      <line x1="856" y1="150" x2="856" y2="128" stroke="#3b82f6" stroke-width="2"/>
      <line x1="856" y1="128" x2="843" y2="116" stroke="#3b82f6" stroke-width="2"/>
      <line x1="856" y1="128" x2="869" y2="116" stroke="#3b82f6" stroke-width="2"/>
      <rect x="836" y="150" width="40" height="30" rx="5" fill="#0e1a2b" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="856" cy="165" r="4" fill="#60a5fa">
        <animate attributeName="fill-opacity" values="0.2;1;0.2" dur="3.4s" begin="2.9s" repeatCount="indefinite"/>
      </circle>
      <text x="856" y="200" text-anchor="middle" fill="#7fb0f5" font-size="10" letter-spacing="0.5">899/900 · −30 dBm</text>
    </g>

    <!-- headline -->
    <text x="60" y="70" fill="#eef4ff" font-size="46" font-weight="800" letter-spacing="0.5">RTL8852AU</text>
    <text x="62" y="102" fill="url(#accent)" font-size="19" font-weight="600" letter-spacing="2.5">NO-ROOT USERSPACE Wi-Fi DRIVER</text>
    <text x="62" y="128" fill="#7d8aa5" font-size="13.5" letter-spacing="0.3">ASUS USB-AX56 · libusb / usbfs — no kernel module, no root · monitor RX + on-air TX, even from an Android phone</text>

    <!-- capability chips -->
    <g font-size="12.5" font-weight="600">
      <g transform="translate(360,158)">
        <rect width="92" height="26" rx="13" fill="#0e2033" stroke="#22d3ee" stroke-opacity="0.5"/>
        <circle cx="16" cy="13" r="4" fill="#34d399"/><text x="30" y="17" fill="#bfe9f5">monitor</text>
      </g>
      <g transform="translate(360,192)">
        <rect width="92" height="26" rx="13" fill="#0e2033" stroke="#22d3ee" stroke-opacity="0.5"/>
        <circle cx="16" cy="13" r="4" fill="#34d399"/><text x="30" y="17" fill="#bfe9f5">scan</text>
      </g>
      <g transform="translate(462,158)">
        <rect width="118" height="26" rx="13" fill="#0e2033" stroke="#22d3ee" stroke-opacity="0.5"/>
        <circle cx="16" cy="13" r="4" fill="#34d399"/><text x="30" y="17" fill="#bfe9f5">channel-hop</text>
      </g>
      <g transform="translate(462,192)">
        <rect width="118" height="26" rx="13" fill="#122a1d" stroke="#34d399"/>
        <circle cx="16" cy="13" r="4" fill="#34d399"/>
        <text x="30" y="17" fill="#c7f0d3" font-weight="700">TX inject</text>
      </g>
    </g>
  </g>
</svg>
