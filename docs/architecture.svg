<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1424"/><stop offset="1" stop-color="#0a1a2b"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5f7d88"/>
    </marker>
    <marker id="arrc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" rx="16" fill="url(#abg)"/>
  <rect x="0.5" y="0.5" width="1199" height="759" rx="16" fill="none" stroke="#1e2d43"/>

  <text x="40" y="52" fill="#e6edf3" font-size="26" font-weight="700">Architecture</text>
  <text x="40" y="78" fill="#8b98a5" font-size="15">No kernel driver. The host speaks USB control and bulk transfers directly; the firmware runs the radio.</text>

  <!-- ================= HOST ================= -->
  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
    <rect x="70" y="108" width="350" height="360" rx="12" fill="#0e1c30" stroke="#24425f"/>
    <rect x="70" y="108" width="350" height="42" rx="12" fill="#132a44"/>
    <rect x="70" y="138" width="350" height="12" fill="#132a44"/>
    <text x="90" y="135" fill="#e6edf3" font-size="15" font-weight="700">HOST — hwdriver.c  ·  libusb / usbfs</text>

    <g>
      <rect x="90" y="164" width="310" height="64" rx="9" fill="#10233a" stroke="#2a4a66"/>
      <text x="106" y="192" fill="#7ed4f2" font-size="14.5" font-weight="700">hwburst_fwdl</text>
      <text x="106" y="214" fill="#8b98a5" font-size="12.5">power-on + firmware download, poll STS = 7</text>
    </g>
    <g>
      <rect x="90" y="236" width="310" height="64" rx="9" fill="#10233a" stroke="#2a4a66"/>
      <text x="106" y="264" fill="#7ed4f2" font-size="14.5" font-weight="700">op-replay</text>
      <text x="106" y="286" fill="#8b98a5" font-size="12.5">register writes / reads / bulk, from a capture blob</text>
    </g>
    <g>
      <rect x="90" y="308" width="310" height="64" rx="9" fill="#10233a" stroke="#2a4a66"/>
      <text x="106" y="336" fill="#7ed4f2" font-size="14.5" font-weight="700">rxd strip</text>
      <text x="106" y="358" fill="#8b98a5" font-size="12.5">aggregated units to 802.11 frames + PPDU RSSI</text>
    </g>
    <g>
      <rect x="90" y="380" width="310" height="64" rx="9" fill="#10233a" stroke="#2a4a66"/>
      <text x="106" y="408" fill="#7ed4f2" font-size="14.5" font-weight="700">radiotap pcap</text>
      <text x="106" y="430" fill="#8b98a5" font-size="12.5">channel + per-frame dBm, opens in Wireshark</text>
    </g>
  </g>

  <!-- ================= CHIP ================= -->
  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
    <rect x="780" y="108" width="350" height="360" rx="12" fill="#0e1c30" stroke="#24425f"/>
    <rect x="780" y="108" width="350" height="42" rx="12" fill="#13233a"/>
    <rect x="780" y="138" width="350" height="12" fill="#13233a"/>
    <text x="800" y="135" fill="#e6edf3" font-size="15" font-weight="700">RTL8852AU  —  on-chip MCU + radio</text>

    <g>
      <rect x="800" y="162" width="310" height="52" rx="9" fill="#10233a" stroke="#2a4a66"/>
      <text x="816" y="193" fill="#cfe4f5" font-size="13.5">power-on sequence</text>
    </g>
    <g>
      <rect x="800" y="222" width="310" height="52" rx="9" fill="#10233a" stroke="#2a4a66"/>
      <text x="816" y="253" fill="#cfe4f5" font-size="13.5">firmware 0.13.36.2  (booted)</text>
    </g>
    <g>
      <rect x="800" y="282" width="310" height="52" rx="9" fill="#10233a" stroke="#2a4a66"/>
      <text x="816" y="313" fill="#cfe4f5" font-size="13.5">MAC / BB / RF init</text>
    </g>
    <g>
      <rect x="800" y="342" width="310" height="52" rx="9" fill="#1b2334" stroke="#7a5a1f"/>
      <text x="816" y="366" fill="#fbbf24" font-size="13.5">RFK calibration  (host-driven)</text>
      <text x="816" y="384" fill="#8b7a4f" font-size="11.5">DACK · IQK · DPK · RXDCK · TSSI</text>
    </g>
    <g>
      <rect x="800" y="402" width="310" height="52" rx="9" fill="#10233a" stroke="#2a4a66"/>
      <text x="816" y="433" fill="#cfe4f5" font-size="13.5">monitor filter  R_AX_RX_FLTR_OPT 0xCE20</text>
    </g>
  </g>

  <!-- ================= USB LINK ================= -->
  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5">
    <!-- control R/W -->
    <text x="600" y="196" fill="#8b98a5" text-anchor="middle">control  0x40 / 0x05  ·  register R / W</text>
    <line x1="424" y1="210" x2="776" y2="210" stroke="#5f7d88" stroke-width="2" marker-end="url(#arr)"/>
    <!-- bulk OUT EP7 -->
    <text x="600" y="266" fill="#8b98a5" text-anchor="middle">bulk-OUT  EP7  ·  firmware + H2C</text>
    <line x1="424" y1="280" x2="776" y2="280" stroke="#5f7d88" stroke-width="2" marker-end="url(#arr)"/>
    <!-- bulk IN EP 0x84 (RX, animated) -->
    <text x="600" y="404" fill="#7ed4f2" text-anchor="middle">bulk-IN  EP 0x84  ·  802.11 frames</text>
    <line x1="776" y1="418" x2="424" y2="418" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrc)"/>
    <circle r="5" fill="#22d3ee">
      <animate attributeName="cx" values="770;430" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="418;418" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================= OUTPUT ================= -->
  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
    <line x1="245" y1="468" x2="245" y2="502" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrc)"/>
    <rect x="90" y="506" width="150" height="48" rx="9" fill="#10233a" stroke="#38bdf8"/>
    <text x="165" y="535" fill="#7ed4f2" font-size="13.5" text-anchor="middle">ax56.pcap</text>
    <line x1="240" y1="530" x2="300" y2="530" stroke="#5f7d88" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="304" y="506" width="200" height="48" rx="9" fill="#0e1c30" stroke="#24425f"/>
    <text x="404" y="535" fill="#cfe4f5" font-size="13.5" text-anchor="middle">Wireshark / tcpdump</text>
  </g>

  <!-- ================= METHODOLOGY LANE ================= -->
  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
    <rect x="70" y="596" width="1060" height="132" rx="12" fill="#0b1626" stroke="#1e3350"/>
    <text x="90" y="626" fill="#e6edf3" font-size="14.5" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">Capture once, replay in userspace</text>
    <text x="90" y="648" fill="#8b98a5" font-size="12.5" font-family="'Segoe UI',system-ui,sans-serif">The kernel driver's own bring-up is recorded, then replayed over libusb. Any channel is just another blob.</text>

    <g transform="translate(90 664)">
      <rect x="0" y="0" width="230" height="46" rx="9" fill="#10233a" stroke="#2a4a66"/>
      <text x="115" y="21" fill="#cfe4f5" font-size="12.5" text-anchor="middle">kernel rtw89 + usbmon</text>
      <text x="115" y="37" fill="#8b98a5" font-size="11" text-anchor="middle">monitor bring-up on channel N</text>
    </g>
    <line x1="326" y1="687" x2="366" y2="687" stroke="#5f7d88" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(370 664)">
      <rect x="0" y="0" width="200" height="46" rx="9" fill="#10233a" stroke="#2a4a66"/>
      <text x="100" y="21" fill="#cfe4f5" font-size="12.5" text-anchor="middle">parse-usbmon.ts</text>
      <text x="100" y="37" fill="#8b98a5" font-size="11" text-anchor="middle">usbmon to op blob</text>
    </g>
    <line x1="576" y1="687" x2="616" y2="687" stroke="#5f7d88" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(620 664)">
      <rect x="0" y="0" width="200" height="46" rx="9" fill="#10233a" stroke="#38bdf8"/>
      <text x="100" y="21" fill="#7ed4f2" font-size="12.5" text-anchor="middle">per-channel op blob</text>
      <text x="100" y="37" fill="#8b98a5" font-size="11" text-anchor="middle">consumed by op-replay</text>
    </g>
    <line x1="830" y1="687" x2="1010" y2="687" stroke="#3a4d63" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="920" y="678" fill="#5f7d88" font-size="11" text-anchor="middle">feeds op-replay above</text>
  </g>
</svg>
