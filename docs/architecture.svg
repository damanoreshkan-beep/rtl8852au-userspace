<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 772" width="1200" height="772" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1424"/><stop offset="1" stop-color="#0a1a2b"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5f7d88"/>
    </marker>
    <marker id="arrc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="772" rx="16" fill="url(#abg)"/>
  <rect x="0.5" y="0.5" width="1199" height="771" rx="16" fill="none" stroke="#1e2d43"/>

  <text x="40" y="50" fill="#e6edf3" font-size="26" font-weight="700">Architecture</text>
  <text x="40" y="76" fill="#8b98a5" font-size="15">No kernel driver. The host speaks USB control and bulk transfers directly; the firmware runs the radio.</text>
  <text x="40" y="98" fill="#6b7a89" font-size="13">One hwdriver.c binary — a Linux box (libusb enumerates) or an Android phone (termux-usb passes a usbfs fd), no root either way.</text>

  <!-- ================= HOST ================= -->
  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
    <rect x="70" y="122" width="350" height="352" rx="12" fill="#0e1c30" stroke="#24425f"/>
    <rect x="70" y="122" width="350" height="42" rx="12" fill="#132a44"/>
    <rect x="70" y="152" width="350" height="12" fill="#132a44"/>
    <text x="90" y="149" fill="#e6edf3" font-size="15" font-weight="700">HOST — hwdriver.c  ·  libusb / usbfs</text>

    <g>
      <rect x="90" y="176" width="310" height="58" rx="9" fill="#10233a" stroke="#2a4a66"/>
      <text x="106" y="201" fill="#7ed4f2" font-size="14.5" font-weight="700">hwburst_fwdl</text>
      <text x="106" y="222" fill="#8b98a5" font-size="12.5">power-on + firmware download, poll STS = 7</text>
    </g>
    <g>
      <rect x="90" y="242" width="310" height="58" rx="9" fill="#10233a" stroke="#2a4a66"/>
      <text x="106" y="267" fill="#7ed4f2" font-size="14.5" font-weight="700">op-replay — bring-up</text>
      <text x="106" y="288" fill="#8b98a5" font-size="12.5">MAC/BB/RF · monitor filter · channel, from a blob</text>
    </g>
    <g>
      <rect x="90" y="308" width="310" height="58" rx="9" fill="#1b2334" stroke="#7a5a1f"/>
      <text x="106" y="333" fill="#fbbf24" font-size="14.5" font-weight="700">live RFK calibration</text>
      <text x="106" y="354" fill="#8b7a4f" font-size="12">RCK · DACK · IQK · TSSI · DPK — keys the PA for TX</text>
    </g>
    <!-- split: RX and TX -->
    <g>
      <rect x="90" y="374" width="150" height="82" rx="9" fill="#10233a" stroke="#38bdf8"/>
      <text x="165" y="400" fill="#7ed4f2" font-size="13" font-weight="700" text-anchor="middle">RX</text>
      <text x="165" y="421" fill="#8b98a5" font-size="11.5" text-anchor="middle">rxd strip</text>
      <text x="165" y="438" fill="#8b98a5" font-size="11.5" text-anchor="middle">→ radiotap pcap</text>
    </g>
    <g>
      <rect x="250" y="374" width="150" height="82" rx="9" fill="#122a1d" stroke="#34d399"/>
      <text x="325" y="400" fill="#8fe9dd" font-size="13" font-weight="700" text-anchor="middle">TX</text>
      <text x="325" y="421" fill="#8b98a5" font-size="11.5" text-anchor="middle">[txdesc][frame]</text>
      <text x="325" y="438" fill="#8b98a5" font-size="11.5" text-anchor="middle">→ inject on EP5</text>
    </g>
  </g>

  <!-- ================= CHIP ================= -->
  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
    <rect x="780" y="122" width="350" height="352" rx="12" fill="#0e1c30" stroke="#24425f"/>
    <rect x="780" y="122" width="350" height="42" rx="12" fill="#13233a"/>
    <rect x="780" y="152" width="350" height="12" fill="#13233a"/>
    <text x="800" y="149" fill="#e6edf3" font-size="15" font-weight="700">RTL8852AU  —  on-chip MCU + radio</text>

    <g>
      <rect x="800" y="176" width="310" height="44" rx="9" fill="#10233a" stroke="#2a4a66"/>
      <text x="816" y="203" fill="#cfe4f5" font-size="13.5">power-on sequence</text>
    </g>
    <g>
      <rect x="800" y="228" width="310" height="44" rx="9" fill="#10233a" stroke="#2a4a66"/>
      <text x="816" y="255" fill="#cfe4f5" font-size="13.5">firmware 0.13.36.2  (booted)</text>
    </g>
    <g>
      <rect x="800" y="280" width="310" height="44" rx="9" fill="#10233a" stroke="#2a4a66"/>
      <text x="816" y="307" fill="#cfe4f5" font-size="13.5">MAC / BB / RF init</text>
    </g>
    <g>
      <rect x="800" y="332" width="310" height="50" rx="9" fill="#1b2334" stroke="#7a5a1f"/>
      <text x="816" y="353" fill="#fbbf24" font-size="13.5">RFK calibration  (host-driven)</text>
      <text x="816" y="371" fill="#8b7a4f" font-size="11.5">DACK · IQK · DPK · RXDCK · TSSI</text>
    </g>
    <!-- two exits: monitor (RX) and PA (TX) -->
    <g>
      <rect x="800" y="390" width="150" height="66" rx="9" fill="#10233a" stroke="#38bdf8"/>
      <text x="875" y="416" fill="#7ed4f2" font-size="12.5" text-anchor="middle">monitor filter</text>
      <text x="875" y="434" fill="#8b98a5" font-size="11" text-anchor="middle">0xCE20 sniffer</text>
    </g>
    <g>
      <rect x="960" y="390" width="150" height="66" rx="9" fill="#122a1d" stroke="#34d399"/>
      <text x="1035" y="416" fill="#8fe9dd" font-size="12.5" text-anchor="middle">PA keyed</text>
      <text x="1035" y="434" fill="#8b98a5" font-size="11" text-anchor="middle">radiate over air</text>
    </g>
  </g>

  <!-- ================= USB LINK ================= -->
  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5">
    <!-- control R/W -->
    <text x="600" y="192" fill="#8b98a5" text-anchor="middle">control  0x40 / 0x05  ·  register R / W</text>
    <line x1="424" y1="206" x2="776" y2="206" stroke="#5f7d88" stroke-width="2" marker-end="url(#arr)"/>
    <!-- bulk-OUT EP7 firmware -->
    <text x="600" y="250" fill="#8b98a5" text-anchor="middle">bulk-OUT  EP7  ·  firmware + H2C</text>
    <line x1="424" y1="264" x2="776" y2="264" stroke="#5f7d88" stroke-width="2" marker-end="url(#arr)"/>
    <!-- bulk-OUT EP5 TX (animated, host -> chip) -->
    <text x="600" y="322" fill="#8fe9dd" text-anchor="middle">bulk-OUT  EP5  ·  TX inject</text>
    <line x1="424" y1="336" x2="776" y2="336" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrt)"/>
    <circle r="5" fill="#34d399">
      <animate attributeName="cx" values="430;770" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="336;336" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <!-- bulk-IN EP 0x84 RX (animated, chip -> host) -->
    <text x="600" y="392" fill="#7ed4f2" text-anchor="middle">bulk-IN  EP 0x84  ·  802.11 frames</text>
    <line x1="776" y1="406" x2="424" y2="406" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrc)"/>
    <circle r="5" fill="#22d3ee">
      <animate attributeName="cx" values="770;430" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="406;406" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================= OUTPUTS ================= -->
  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
    <!-- RX out: frames -> pcap -> Wireshark -->
    <line x1="165" y1="456" x2="165" y2="498" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrc)"/>
    <rect x="90" y="502" width="150" height="46" rx="9" fill="#10233a" stroke="#38bdf8"/>
    <text x="165" y="530" fill="#7ed4f2" font-size="13" text-anchor="middle">ax56.pcap</text>
    <line x1="240" y1="525" x2="300" y2="525" stroke="#5f7d88" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="304" y="502" width="196" height="46" rx="9" fill="#0e1c30" stroke="#24425f"/>
    <text x="402" y="530" fill="#cfe4f5" font-size="12.5" text-anchor="middle">Wireshark / tcpdump</text>

    <!-- TX out: PA -> over the air -> 2nd receiver -->
    <line x1="1035" y1="456" x2="1035" y2="498" stroke="#34d399" stroke-width="2" marker-end="url(#arrt)"/>
    <rect x="935" y="502" width="195" height="46" rx="9" fill="#122a1d" stroke="#34d399"/>
    <text x="1032" y="523" fill="#8fe9dd" font-size="12.5" text-anchor="middle">over the air</text>
    <text x="1032" y="539" fill="#8b98a5" font-size="10.5" text-anchor="middle">899/900 caught · -30 dBm</text>
  </g>

  <!-- ================= METHODOLOGY LANE ================= -->
  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
    <rect x="70" y="592" width="1060" height="150" rx="12" fill="#0b1626" stroke="#1e3350"/>
    <text x="90" y="622" fill="#e6edf3" font-size="14.5" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">Capture once, replay in userspace</text>
    <text x="90" y="644" fill="#8b98a5" font-size="12.5" font-family="'Segoe UI',system-ui,sans-serif">The kernel driver's own bring-up is recorded, then replayed over libusb — live RFK cal is the only part the host computes. Any channel is just another blob.</text>

    <g transform="translate(90 662)">
      <rect x="0" y="0" width="230" height="46" rx="9" fill="#10233a" stroke="#2a4a66"/>
      <text x="115" y="21" fill="#cfe4f5" font-size="12.5" text-anchor="middle">kernel rtw89 + usbmon</text>
      <text x="115" y="37" fill="#8b98a5" font-size="11" text-anchor="middle">monitor bring-up on channel N</text>
    </g>
    <line x1="326" y1="685" x2="366" y2="685" stroke="#5f7d88" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(370 662)">
      <rect x="0" y="0" width="200" height="46" rx="9" fill="#10233a" stroke="#2a4a66"/>
      <text x="100" y="21" fill="#cfe4f5" font-size="12.5" text-anchor="middle">parse-usbmon.ts</text>
      <text x="100" y="37" fill="#8b98a5" font-size="11" text-anchor="middle">usbmon → op blob</text>
    </g>
    <line x1="576" y1="685" x2="616" y2="685" stroke="#5f7d88" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(620 662)">
      <rect x="0" y="0" width="200" height="46" rx="9" fill="#10233a" stroke="#38bdf8"/>
      <text x="100" y="21" fill="#7ed4f2" font-size="12.5" text-anchor="middle">per-channel op blob</text>
      <text x="100" y="37" fill="#8b98a5" font-size="11" text-anchor="middle">consumed by op-replay</text>
    </g>
    <line x1="830" y1="685" x2="1010" y2="685" stroke="#3a4d63" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="920" y="676" fill="#5f7d88" font-size="11" text-anchor="middle">feeds op-replay above</text>
  </g>
</svg>
